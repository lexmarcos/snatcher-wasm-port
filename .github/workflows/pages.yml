# Builds the static site (scripts/build-static.sh) and publishes it on GitHub Pages: https://markzuel.com/snatcher-wasm-port/
# The site holds only the engine (wasm), the page and the translation pack. No game data: the player imports their own disc in the browser.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  WASM_BINDGEN_VERSION: 0.2.129

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable with the wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: wasm-bindgen CLI (prebuilt release, pinned)
        run: |
          set -euo pipefail
          v="wasm-bindgen-${WASM_BINDGEN_VERSION}-x86_64-unknown-linux-musl"
          curl -fsSL "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/${WASM_BINDGEN_VERSION}/${v}.tar.gz" | tar -xz -C "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${v}/wasm-bindgen" /usr/local/bin/wasm-bindgen
          wasm-bindgen --version

      - uses: oven-sh/setup-bun@v2

      - name: Build the static site
        run: scripts/build-static.sh

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
